<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide Surah - Syaikh Al-Hushary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: #f6f8f7;
      color: #0f172a;
      padding: 24px 16px 40px;
    }
    .box {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
    }
    .label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0f766e;
      margin-bottom: 8px;
    }
    .judul-surah {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 18px;
    }
    .yt-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #dc2626;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 24px;
    }
    .yt-icon-btn:hover { background: #b91c1c; }
    .play-circle {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #ffffff;
      color: #dc2626;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    button.nav-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: #0f766e;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Bacaan Syaikh Al-Hushary</div>
    <div class="judul-surah" id="judulSurah"></div>

    <a class="yt-icon-btn" id="linkYt" href="#" target="_blank" rel="noopener noreferrer">
      <span class="play-circle" aria-hidden="true">&#9654;</span>
      <span>Tonton di YouTube</span>
    </a>

    <div class="nav">
      <button class="nav-btn" id="btnPrev">Sebelumnya</button>
      <span class="counter" id="counter"></span>
      <button class="nav-btn" id="btnNext">Berikutnya</button>
    </div>
  </div>

  <script>
    const SLIDES = [
      {
        surah: "Surah Al-Fatihah",
        ytUrl: "http://www.youtube.com/watch?v=d_MCKYnol2E"
      },
      {
        surah: "Surah Al-Ikhlas (Juz 'Amma)",
        ytUrl: "http://www.youtube.com/watch?v=9gJpa6U2y_s"
      },
      {
        surah: "Surah Al-Ashr (Juz 'Amma)",
        ytUrl: "http://www.youtube.com/watch?v=q9QCeGMlLVI"
      },
      {
        surah: "Juz 'Amma Lengkap",
        ytUrl: "http://www.youtube.com/watch?v=jO7oTrcxEBA"
      }
    ];

    let idx = 0;
    const judulSurahEl = document.getElementById("judulSurah");
    const linkYtEl = document.getElementById("linkYt");
    const counterEl = document.getElementById("counter");

    function render() {
      const s = SLIDES[idx];
      judulSurahEl.textContent = s.surah;
      linkYtEl.href = s.ytUrl;
      counterEl.textContent = (idx + 1) + " / " + SLIDES.length;
    }

    document.getElementById("btnPrev").addEventListener("click", function() {
      idx = (idx - 1 + SLIDES.length) % SLIDES.length;
      render();
    });

    document.getElementById("btnNext").addEventListener("click", function() {
      idx = (idx + 1) % SLIDES.length;
      render();
    });

    render();
  </script>
</body>
</html>
